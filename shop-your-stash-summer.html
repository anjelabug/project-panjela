  --teal:        #2a7a70;

// ── STATE ──
// { active: id|null, draft: { notes, videoUrl }, cards: { "id": { notes, videoUrl, completedDate } } }
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function persist(st) { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }

function getState() {
  const d = load();
  return {
    active: d.active || null,
    draft:  d.draft  || { notes: '', videoUrl: '' },
    cards:  d.cards  || {}
  };
}

function getPrompt(id) { return PROMPTS.find(p => p.id === id); }
function completedIds(st) { return Object.keys(st.cards).map(Number); }
function remainingPrompts(st) {
  const done = completedIds(st);
  return PROMPTS.filter(p => !done.includes(p.id) && p.id !== st.active);
}
function today() {
  const n = new Date();
  return `${n.getMonth()+1}/${n.getDate()}/${n.getFullYear()}`;
}

// ── AUTO-SAVE DRAFT ──
let draftTimer = null;
function scheduleDraftSave() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    const st = getState();
    if (!st.active) return;
    st.draft.notes    = document.getElementById('notes-input')?.value  || '';
    st.draft.videoUrl = document.getElementById('video-input')?.value  || '';
    persist(st);
  }, 400);
}

// ── ACTIONS ──
function drawCard() {
  const st = getState();
  const pool = remainingPrompts(st);
  if (!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  st.active = pick.id;
  st.draft  = { notes: '', videoUrl: '' };
  persist(st);
  render();
}

function putBack() {
  const st = getState();
  st.active = null;
  st.draft  = { notes: '', videoUrl: '' };
  persist(st);
  render();
}

function completeCard() {
  const st = getState();
  if (!st.active) return;
  const notes    = document.getElementById('notes-input')?.value.trim() || '';
  const videoUrl = document.getElementById('video-input')?.value.trim() || '';
  st.cards[st.active] = { notes, videoUrl, completedDate: today() };
  st.active = null;
  st.draft  = { notes: '', videoUrl: '' };
  persist(st);
  render();
  toast('Prompt archived! ✦');
}

// ── RENDER ──
function render() {
  const st = getState();
  const done = completedIds(st);
  const remaining = remainingPrompts(st);
  const total = 63;
  const doneCount = done.length;
  const pct = Math.round(doneCount / total * 100);

  // Progress
  document.getElementById('progress-label').textContent = `${doneCount} of ${total} complete`;
  document.getElementById('progress-fill').style.width = pct + '%';
  const inPool = remaining.length + (st.active ? 1 : 0);
  document.getElementById('progress-stats').textContent =
    inPool === 0 ? '✦ All 63 prompts complete! ✦' :
    st.active    ? `${inPool} remaining · 1 in progress` :
                   `${inPool} remaining`;

  // Draw section
  const drawEl = document.getElementById('draw-section');
  if (st.active) {
    const p = getPrompt(st.active);
    drawEl.innerHTML = `
      <div class="active-card">
        <div class="card-top">
          <div class="card-number">Prompt #${p.id} of 63</div>
          <div class="card-title">${p.title}</div>
          <div class="card-desc">${p.desc}</div>
        </div>
        <div class="card-body">
          <div class="field-group">
            <label class="field-label" for="notes-input">Notes</label>
            <textarea class="field-textarea" id="notes-input" placeholder="How did you fulfill this prompt? What products did you use? How did the look turn out?" oninput="scheduleDraftSave()">${escHtml(st.draft.notes)}</textarea>
          </div>
          <div class="field-group">
            <label class="field-label" for="video-input">YouTube Short URL</label>
            <input type="text" class="field-input" id="video-input" placeholder="https://youtube.com/shorts/..." value="${escHtml(st.draft.videoUrl)}" oninput="scheduleDraftSave()">
            <div class="field-hint">Add after uploading to the project-panjela channel · #shopyourstashroulette</div>
          </div>
          <div class="card-actions">
            <button class="btn-putback" onclick="putBack()">Put Back</button>
            <button class="btn-complete" onclick="completeCard()">✦ Complete &amp; Archive</button>
          </div>
        </div>
      </div>
    `;
  } else if (inPool === 0) {
    drawEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">☀</div>
        <div class="empty-title">All 63 prompts complete!</div>
        <div class="empty-sub">You shopped your stash all summer long</div>
      </div>
    `;
  } else {
    drawEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✿</div>
        <div class="empty-title">Ready to shop your stash?</div>
        <div class="empty-sub">${remaining.length} prompt${remaining.length !== 1 ? 's' : ''} remaining in the pool</div>
        <button class="draw-btn" onclick="drawCard()">✦ Draw a Prompt ✦</button>
      </div>
    `;
  }

  // Completed grid
  const compSection = document.getElementById('completed-section');
  const grid = document.getElementById('completed-grid');
  if (doneCount > 0) {
    compSection.style.display = '';
    const sorted = [...done].sort((a, b) => {
      // Sort most-recently-completed first
      const da = st.cards[a]?.completedDate || '';
      const db = st.cards[b]?.completedDate || '';
      return db < da ? -1 : db > da ? 1 : b - a;
    });
    grid.innerHTML = sorted.map(id => {
      const p = getPrompt(id);
      const card = st.cards[id] || {};
      return `<div class="mini-card" onclick="openModal(${id})" title="#${p.id} · ${p.title}">
        <div class="mini-num">#${p.id}</div>
        <div class="mini-title">${p.title}</div>
        <div class="mini-footer">
          <span class="mini-check">✦</span>
          ${card.videoUrl ? '<span class="mini-video-badge">▶ Short</span>' : ''}
        </div>
      </div>`;
    }).join('');
  } else {
    compSection.style.display = 'none';
  }

  // Remaining browse
  const remList = document.getElementById('remaining-list');
  remList.innerHTML = remaining.map(p =>
    `<div class="remaining-chip" title="${p.desc}">#${p.id} ${p.title}</div>`
  ).join('');

  // Hide remaining toggle if nothing remaining
  document.getElementById('remaining-section').style.display =
    remaining.length > 0 ? '' : 'none';
}

// ── MODAL ──
let activeModalId = null;

function openModal(id) {
  activeModalId = id;
  const st = getState();
  const p = getPrompt(id);
  const card = st.cards[id] || {};
  document.getElementById('modal-num').textContent    = `Prompt #${p.id} of 63`;
  document.getElementById('modal-title').textContent  = p.title;
  document.getElementById('modal-desc').textContent   = p.desc;
  document.getElementById('modal-meta').textContent   = `Completed ${card.completedDate || ''}`;
  document.getElementById('modal-notes-text').textContent = card.notes || '(No notes added)';
  document.getElementById('modal-url-input').value    = card.videoUrl || '';
  refreshModalLink(card.videoUrl);
  document.getElementById('modal-backdrop').style.display = 'flex';
}

function refreshModalLink(url) {
  const wrap = document.getElementById('modal-video-link-wrap');
  wrap.innerHTML = url
    ? `<a class="modal-video-link" href="${escHtml(url)}" target="_blank" rel="noopener">▶ Watch on YouTube ↗</a>`
    : '';
}

function saveModalUrl() {
  if (!activeModalId) return;
  const url = document.getElementById('modal-url-input').value.trim();
  const st = getState();
  if (!st.cards[activeModalId]) st.cards[activeModalId] = {};
  st.cards[activeModalId].videoUrl = url;
  persist(st);
  refreshModalLink(url);
  render();
  toast('URL saved ✦');
}

function closeModal() {
  document.getElementById('modal-backdrop').style.display = 'none';
  activeModalId = null;
}
function handleBackdropClick(e) {
  if (e.target.id === 'modal-backdrop') closeModal();
}

// ── REMAINING TOGGLE ──
let remainingOpen = false;
function toggleRemaining() {
  remainingOpen = !remainingOpen;
  document.getElementById('remaining-list').style.display = remainingOpen ? 'flex' : 'none';
  document.getElementById('remaining-toggle').textContent =
    remainingOpen ? '▴ Hide remaining prompts' : '▾ Browse remaining prompts';
}

// ── TOAST ──
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── UTIL ──
function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──
render();
</script>
</body>
</html>
